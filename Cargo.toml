[package]
name = "dns-shunt"
description = "Local DNS override utility"
version = "0.2.1"
authors = ["Joni Kollani <joni.kollani@gmail.com>"]
license = "MIT"
homepage = "https://sop.github.io/dns-shunt/"
repository = "https://github.com/sop/dns-shunt"
edition = "2024"

[[bench]]
name = "interception"
harness = false

[dependencies]
getrandom = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"

[build-dependencies]
chrono = "0.4"
winres = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
ctrlc = "3"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_EventLog",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows_048 = { package = "windows", version = "=0.48.0", features = [
    "Win32_Foundation",
    "Win32_System_IO",
] }
windivert = { version = "=0.6.0", features = ["vendored"] }
windivert-sys = { version = "=0.10.0", features = ["vendored"] }

[[bin]]
name = "dns-shunt-tray"
path = "src/bin/dns-shunt-tray.rs"
